<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Great Books Digital Portfolio</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the full path in sessionStorage and redirects to the base URL
      var segmentCount = 1; // number of path segments in the base URL (/GreatBooks)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>Redirecting...</body>
</html>
